name: Release bundles

# Builds IGV-style zips on each OS (jpackage cannot cross-compile) and publishes
# them to a GitHub Release when a v* tag is pushed (e.g. v0.2.4).
#
# Trigger:
#   git tag v0.2.4 && git push origin v0.2.4
#   or Actions → "Release bundles" → Run workflow (optional tag input)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create/update this release tag (e.g. v0.2.4). Empty = artifacts only."
        required: false
        type: string
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            artifact: macos-arm64
            javafx_classifier: mac-aarch64
          - os: macos-13          # Intel
            artifact: macos-x64
            javafx_classifier: mac
          - os: ubuntu-22.04
            artifact: linux-x64
            javafx_classifier: linux
          - os: windows-2022
            artifact: windows-x64
            javafx_classifier: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Read VERSION
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f VERSION ]]; then
            V="$(tr -d '[:space:]' < VERSION)"
          else
            V=0.2.0
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "SODAviewer version=$V"

      - name: Fetch deps + platform JavaFX + build fat JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lib lib/javafx target/classes target/fat
          BASE=https://repo.maven.apache.org/maven2
          JFX_VER=17.0.14

          # Match pom.xml / windows-dist.yml (jhdf 0.13.x tree)
          curl -fsSL -o lib/jhdf-0.13.0.jar \
            "$BASE/io/jhdf/jhdf/0.13.0/jhdf-0.13.0.jar"
          curl -fsSL -o lib/slf4j-api-2.0.18.jar \
            "$BASE/org/slf4j/slf4j-api/2.0.18/slf4j-api-2.0.18.jar"
          curl -fsSL -o lib/slf4j-nop-2.0.18.jar \
            "$BASE/org/slf4j/slf4j-nop/2.0.18/slf4j-nop-2.0.18.jar"
          curl -fsSL -o lib/commons-lang3-3.20.0.jar \
            "$BASE/org/apache/commons/commons-lang3/3.20.0/commons-lang3-3.20.0.jar"
          curl -fsSL -o lib/compress-lzf-1.2.0.jar \
            "$BASE/com/ning/compress-lzf/1.2.0/compress-lzf-1.2.0.jar"
          curl -fsSL -o lib/lz4-java-1.11.1.jar \
            "$BASE/org/lz4/lz4-java/1.11.1/lz4-java-1.11.1.jar"

          # OpenJFX natives for this runner (needed by package-app.sh / WebView overview)
          JFX_CLASS="${{ matrix.javafx_classifier }}"
          for mod in base controls graphics swing web; do
            curl -fsSL -o "lib/javafx/javafx-${mod}-${JFX_VER}-${JFX_CLASS}.jar" \
              "$BASE/org/openjfx/javafx-${mod}/${JFX_VER}/javafx-${mod}-${JFX_VER}-${JFX_CLASS}.jar"
          done

          CP="$(echo lib/*.jar | tr ' ' ':')"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            CP="$(echo lib/*.jar | tr ' ' ';')"
          fi
          javac --release 17 -cp "$CP" -d target/classes src/main/java/sodaviewer/*.java
          if [[ -d src/main/resources ]]; then
            cp -R src/main/resources/. target/classes/
          fi

          APP_VER="${{ steps.ver.outputs.version }}"
          (
            cd target/fat
            for j in ../../lib/*.jar; do jar xf "$j"; done
            rm -f META-INF/*.SF META-INF/*.DSA META-INF/*.RSA || true
            cp -R ../classes/* .
            mkdir -p META-INF
            printf 'Manifest-Version: 1.0\nMain-Class: sodaviewer.Main\nImplementation-Title: SODAviewer\nImplementation-Version: %s\n\n' "$APP_VER" \
              > META-INF/MANIFEST.MF
            jar cfm ../SODAviewer.jar META-INF/MANIFEST.MF .
          )
          ls -lh target/SODAviewer.jar
          ls lib/javafx/

      - name: Package bundled runtime
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          bash package-app.sh
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            EXE="dist/SODAviewer/SODAviewer.exe"
            [[ -f "$EXE" ]] || { echo "Missing $EXE"; find dist -maxdepth 3 -type f | head -50; exit 1; }
            cp -f "$EXE" "dist/SODAviewer.exe"
          fi
          ls -lh dist/SODAviewer-* 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SODAviewer-${{ matrix.artifact }}-${{ steps.ver.outputs.version }}
          path: |
            dist/SODAviewer-*.zip
            dist/SODAviewer-*.tar.gz
            dist/SODAviewer-*.dmg
            dist/SODAviewer-*.jar
            dist/SODAviewer.exe
          if-no-files-found: error

  release:
    needs: package
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          find artifacts -type f \( \
            -name 'SODAviewer-*.zip' -o \
            -name 'SODAviewer-*.tar.gz' -o \
            -name 'SODAviewer-*.dmg' -o \
            -name 'SODAviewer-*.jar' -o \
            -name 'SODAviewer.exe' \
          \) -exec cp -f {} upload/ \;
          ls -lh upload/
          test "$(find upload -type f | wc -l)" -gt 0

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: SODAviewer ${{ inputs.release_tag || github.ref_name }}
          files: upload/*
          generate_release_notes: true
          fail_on_unmatched_files: true
