name: Release bundles

# Builds IGV-style zips on each OS (jpackage cannot cross-compile) and publishes
# them to a GitHub Release when a v* tag is pushed (e.g. v0.2.4).
#
# Trigger:
#   git tag v0.2.4 && git push origin v0.2.4
#   or Actions → "Release bundles" → Run workflow (optional tag input)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create/update this release tag (e.g. v0.2.4). Empty = artifacts only."
        required: false
        type: string
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            artifact: macos-arm64
            javafx_classifier: mac-aarch64
          - os: macos-13          # Intel
            artifact: macos-x64
            javafx_classifier: mac
          - os: ubuntu-22.04
            artifact: linux-x64
            javafx_classifier: linux
          # Portable Windows zip cross-builds on Ubuntu (no jpackage / Git Bash).
          - os: ubuntu-22.04
            artifact: windows-x64
            javafx_classifier: win
            windows_portable: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Read VERSION
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f VERSION ]]; then
            V="$(tr -d '[:space:]' < VERSION)"
          else
            V=0.2.0
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "SODAviewer version=$V"

      - name: Maven package (+ platform JavaFX for jpackage legs)
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -DskipTests package
          test -f target/SODAviewer.jar
          if [[ "${{ matrix.windows_portable }}" != "true" ]]; then
            mkdir -p lib/javafx
            BASE=https://repo.maven.apache.org/maven2
            JFX_VER=17.0.14
            JFX_CLASS="${{ matrix.javafx_classifier }}"
            for mod in base controls graphics swing web; do
              curl -fsSL -o "lib/javafx/javafx-${mod}-${JFX_VER}-${JFX_CLASS}.jar" \
                "$BASE/org/openjfx/javafx-${mod}/${JFX_VER}/javafx-${mod}-${JFX_VER}-${JFX_CLASS}.jar"
              test -s "lib/javafx/javafx-${mod}-${JFX_VER}-${JFX_CLASS}.jar"
            done
            ls -lh lib/javafx/
          fi
          ls -lh target/SODAviewer.jar

      - name: Package bundled runtime
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.windows_portable }}" == "true" ]]; then
            bash package-windows-portable.sh
            test -f "dist/SODAviewer-${{ steps.ver.outputs.version }}-windows-x64.zip"
          else
            bash package-app.sh
          fi
          ls -lh dist/SODAviewer-* 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SODAviewer-${{ matrix.artifact }}-${{ steps.ver.outputs.version }}
          path: |
            dist/SODAviewer-*.zip
            dist/SODAviewer-*.tar.gz
            dist/SODAviewer-*.dmg
            dist/SODAviewer-*.jar
          if-no-files-found: error

  release:
    needs: package
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          find artifacts -type f \( \
            -name 'SODAviewer-*.zip' -o \
            -name 'SODAviewer-*.tar.gz' -o \
            -name 'SODAviewer-*.dmg' -o \
            -name 'SODAviewer-*.jar' \
          \) -exec cp -f {} upload/ \;
          ls -lh upload/
          test "$(find upload -type f | wc -l)" -gt 0

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: SODAviewer ${{ inputs.release_tag || github.ref_name }}
          files: upload/*
          generate_release_notes: true
          fail_on_unmatched_files: true
