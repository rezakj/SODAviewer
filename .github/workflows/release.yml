name: Release bundles

# Builds IGV-style zips on each OS (jpackage cannot cross-compile).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            artifact: macos-arm64
          - os: macos-13          # Intel
            artifact: macos-x64
          - os: ubuntu-22.04
            artifact: linux-x64
          - os: windows-2022
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch deps + build fat JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lib target/classes target/fat
          BASE=https://repo.maven.apache.org/maven2
          curl -fsSL -o lib/jhdf-0.9.0.jar           "$BASE/io/jhdf/jhdf/0.9.0/jhdf-0.9.0.jar"
          curl -fsSL -o lib/slf4j-api-1.7.36.jar     "$BASE/org/slf4j/slf4j-api/1.7.36/slf4j-api-1.7.36.jar"
          curl -fsSL -o lib/slf4j-nop-1.7.36.jar     "$BASE/org/slf4j/slf4j-nop/1.7.36/slf4j-nop-1.7.36.jar"
          curl -fsSL -o lib/commons-lang3-3.17.0.jar "$BASE/org/apache/commons/commons-lang3/3.17.0/commons-lang3-3.17.0.jar"
          curl -fsSL -o lib/compress-lzf-1.1.2.jar   "$BASE/com/ning/compress-lzf/1.1.2/compress-lzf-1.1.2.jar"
          curl -fsSL -o lib/lz4-java-1.8.0.jar       "$BASE/org/lz4/lz4-java/1.8.0/lz4-java-1.8.0.jar"
          CP=$(echo lib/*.jar | tr ' ' ':')
          # Windows Git Bash: use ; for javac classpath
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            CP=$(echo lib/*.jar | tr ' ' ';')
          fi
          javac --release 17 -cp "$CP" -d target/classes src/main/java/sodaviewer/*.java
          cd target/fat
          for j in ../../lib/*.jar; do jar xf "$j"; done
          rm -f META-INF/*.SF META-INF/*.DSA META-INF/*.RSA || true
          cp -R ../classes/* .
          mkdir -p META-INF
          printf 'Manifest-Version: 1.0\nMain-Class: sodaviewer.Main\n\n' > META-INF/MANIFEST.MF
          jar cfm ../SODAviewer.jar META-INF/MANIFEST.MF .

      - name: Package bundled runtime
        shell: bash
        env:
          VERSION: "1.0.0"
        run: bash package-app.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SODAviewer-${{ matrix.artifact }}
          path: |
            dist/SODAviewer-*.zip
            dist/SODAviewer-*.tar.gz
            dist/SODAviewer-*.jar
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten + publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
