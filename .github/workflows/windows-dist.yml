name: Windows dist (portable)

# Durable Windows x64 ship: fat JAR + Temurin JRE + OpenJFX + SODAviewer.bat
# (Native jpackage .exe kept failing on windows-2022; portable zip is the CI path.)
#
# Trigger:
#   Actions → "Windows dist (portable)" → Run workflow
#   Optional: check "Publish to GitHub Release" + tag (e.g. v0.2.4)
#   Or: push to main/master touching this workflow / packaging scripts
#
# Full multi-OS Release: push a v* tag → "Release bundles"
# (Windows leg of that workflow also uses the portable zip.)
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Upload Windows portable zip/jar to a GitHub Release"
        type: boolean
        default: false
      release_tag:
        description: "Release tag (e.g. v0.2.4). Empty = v$VERSION from VERSION file"
        type: string
        default: ""
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/windows-dist.yml"
      - "package-windows-portable.sh"
      - "package-app.sh"
      - "build.sh"
      - "pom.xml"
      - "VERSION"
      - "src/**"

permissions:
  contents: write

jobs:
  windows-portable:
    # Portable zip is cross-built (Win JRE + Win JavaFX + .bat); Ubuntu avoids
    # windows-2022 Git Bash missing unzip/python3/du (exit 127).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Read VERSION
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f VERSION ]]; then
            V="$(tr -d '[:space:]' < VERSION)"
          else
            V=0.2.0
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v${V}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "SODAviewer version=$V tag=$TAG"

      - name: Maven package
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -DskipTests package
          test -f target/SODAviewer.jar
          ls -lh target/SODAviewer.jar

      - name: Portable Windows zip (JRE + JavaFX + bat)
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          bash package-windows-portable.sh
          test -f "dist/SODAviewer-${{ steps.ver.outputs.version }}-windows-x64.zip"
          ls -lh dist/SODAviewer-*-windows-x64.zip dist/SODAviewer-*.jar dist/WINDOWS-BUILD.txt

      - name: Upload Windows portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SODAviewer-windows-x64-${{ steps.ver.outputs.version }}
          path: |
            dist/SODAviewer-*-windows-x64.zip
            dist/SODAviewer-*.jar
            dist/WINDOWS-BUILD.txt
          if-no-files-found: error

      - name: Publish Windows assets to GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: SODAviewer ${{ steps.ver.outputs.tag }}
          files: |
            dist/SODAviewer-*-windows-x64.zip
            dist/SODAviewer-*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
