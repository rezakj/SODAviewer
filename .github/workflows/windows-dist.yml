name: Windows dist (.exe)

# Native jpackage Windows app-image (SODAviewer.exe). Cannot be built on macOS.
# Trigger: Actions → "Windows dist (.exe)" → Run workflow
# Or: push to main/master touching this workflow / packaging scripts.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/windows-dist.yml"
      - "package-app.sh"
      - "build.sh"
      - "pom.xml"
      - "VERSION"
      - "src/**"

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Read VERSION
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f VERSION ]]; then
            V="$(tr -d '[:space:]' < VERSION)"
          else
            V=0.2.0
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "SODAviewer version=$V"

      - name: Fetch deps + Windows JavaFX + build fat JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lib lib/javafx target/classes target/fat
          BASE=https://repo.maven.apache.org/maven2
          JFX_VER=17.0.14

          # Match local/pom dependency versions (jhdf 0.13.x tree)
          curl -fsSL -o lib/jhdf-0.13.0.jar \
            "$BASE/io/jhdf/jhdf/0.13.0/jhdf-0.13.0.jar"
          curl -fsSL -o lib/slf4j-api-2.0.18.jar \
            "$BASE/org/slf4j/slf4j-api/2.0.18/slf4j-api-2.0.18.jar"
          curl -fsSL -o lib/slf4j-nop-2.0.18.jar \
            "$BASE/org/slf4j/slf4j-nop/2.0.18/slf4j-nop-2.0.18.jar"
          curl -fsSL -o lib/commons-lang3-3.20.0.jar \
            "$BASE/org/apache/commons/commons-lang3/3.20.0/commons-lang3-3.20.0.jar"
          curl -fsSL -o lib/compress-lzf-1.2.0.jar \
            "$BASE/com/ning/compress-lzf/1.2.0/compress-lzf-1.2.0.jar"
          curl -fsSL -o lib/lz4-java-1.11.1.jar \
            "$BASE/org/lz4/lz4-java/1.11.1/lz4-java-1.11.1.jar"

          # OpenJFX Windows natives (needed by package-app.sh / WebView overview)
          for mod in base controls graphics swing web; do
            curl -fsSL -o "lib/javafx/javafx-${mod}-${JFX_VER}-win.jar" \
              "$BASE/org/openjfx/javafx-${mod}/${JFX_VER}/javafx-${mod}-${JFX_VER}-win.jar"
          done

          # Windows Git Bash: javac classpath uses ';'
          CP="$(echo lib/*.jar | tr ' ' ';')"
          javac --release 17 -cp "$CP" -d target/classes src/main/java/sodaviewer/*.java
          if [[ -d src/main/resources ]]; then
            cp -R src/main/resources/. target/classes/
          fi

          APP_VER="${{ steps.ver.outputs.version }}"
          (
            cd target/fat
            for j in ../../lib/*.jar; do jar xf "$j"; done
            rm -f META-INF/*.SF META-INF/*.DSA META-INF/*.RSA || true
            cp -R ../classes/* .
            mkdir -p META-INF
            printf 'Manifest-Version: 1.0\nMain-Class: sodaviewer.Main\nImplementation-Title: SODAviewer\nImplementation-Version: %s\n\n' "$APP_VER" \
              > META-INF/MANIFEST.MF
            jar cfm ../SODAviewer.jar META-INF/MANIFEST.MF .
          )
          ls -lh target/SODAviewer.jar
          ls lib/javafx/

      - name: jpackage Windows app-image (SODAviewer.exe)
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          command -v jpackage
          command -v jlink
          bash package-app.sh
          # Flatten a copy of the launcher for a simple artifact name
          EXE="dist/SODAviewer/SODAviewer.exe"
          [[ -f "$EXE" ]] || { echo "Missing $EXE"; find dist -maxdepth 3 -type f | head -50; exit 1; }
          cp -f "$EXE" "dist/SODAviewer.exe"
          ls -lh dist/SODAviewer.exe dist/SODAviewer-*-windows-x64.zip

      - name: Upload SODAviewer.exe + zip
        uses: actions/upload-artifact@v4
        with:
          name: SODAviewer-windows-x64-${{ steps.ver.outputs.version }}
          path: |
            dist/SODAviewer.exe
            dist/SODAviewer-*-windows-x64.zip
            dist/SODAviewer-*.jar
          if-no-files-found: error
