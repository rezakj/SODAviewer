name: Windows dist (.exe)

# Native jpackage Windows app-image (SODAviewer.exe). Cannot be built on macOS.
#
# Trigger:
#   Actions → "Windows dist (.exe)" → Run workflow
#   Optional: check "Publish to GitHub Release" + tag (e.g. v0.2.4)
#   Or: push to main/master touching this workflow / packaging scripts
#
# Full multi-OS Release (including Windows): push a v* tag → "Release bundles"
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Upload Windows zip/exe to a GitHub Release"
        type: boolean
        default: false
      release_tag:
        description: "Release tag (e.g. v0.2.4). Empty = v$VERSION from VERSION file"
        type: string
        default: ""
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/windows-dist.yml"
      - "package-app.sh"
      - "build.sh"
      - "pom.xml"
      - "VERSION"
      - "src/**"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Read VERSION
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f VERSION ]]; then
            V="$(tr -d '[:space:]' < VERSION)"
          else
            V=0.2.0
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v${V}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "SODAviewer version=$V tag=$TAG"

      # PowerShell avoids Git Bash/MSYS mangling of ';' classpaths.
      - name: Fetch deps + Windows JavaFX + build fat JAR
        shell: pwsh
        env:
          APP_VER: ${{ steps.ver.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path lib, lib/javafx, target/classes, target/fat | Out-Null
          $BASE = 'https://repo.maven.apache.org/maven2'
          $JFX_VER = '17.0.14'

          function Get-MavenJar([string]$Out, [string]$Url) {
            Write-Host "GET $Url"
            & curl.exe -fsSL -o $Out $Url
            if (-not (Test-Path $Out) -or (Get-Item $Out).Length -lt 1000) {
              throw "Download failed or too small: $Out"
            }
          }

          # Match local/pom dependency versions (jhdf 0.13.x tree)
          Get-MavenJar 'lib/jhdf-0.13.0.jar' "$BASE/io/jhdf/jhdf/0.13.0/jhdf-0.13.0.jar"
          Get-MavenJar 'lib/slf4j-api-2.0.18.jar' "$BASE/org/slf4j/slf4j-api/2.0.18/slf4j-api-2.0.18.jar"
          Get-MavenJar 'lib/slf4j-nop-2.0.18.jar' "$BASE/org/slf4j/slf4j-nop/2.0.18/slf4j-nop-2.0.18.jar"
          Get-MavenJar 'lib/commons-lang3-3.20.0.jar' "$BASE/org/apache/commons/commons-lang3/3.20.0/commons-lang3-3.20.0.jar"
          Get-MavenJar 'lib/compress-lzf-1.2.0.jar' "$BASE/com/ning/compress-lzf/1.2.0/compress-lzf-1.2.0.jar"
          # jhdf 0.13 pulls at.yawk.lz4 (not org.lz4; 1.11.1 is not on org.lz4)
          Get-MavenJar 'lib/lz4-java-1.11.1.jar' "$BASE/at/yawk/lz4/lz4-java/1.11.1/lz4-java-1.11.1.jar"

          foreach ($mod in @('base','controls','graphics','swing','web')) {
            Get-MavenJar "lib/javafx/javafx-$mod-$JFX_VER-win.jar" `
              "$BASE/org/openjfx/javafx-$mod/$JFX_VER/javafx-$mod-$JFX_VER-win.jar"
          }

          # Absolute jar paths + quoted -cp (';' must not be a PS statement break).
          $jars = @(Get-ChildItem lib/*.jar, lib/javafx/*.jar | ForEach-Object FullName)
          if ($jars.Count -lt 8) { throw "Expected deps+javafx jars, found $($jars.Count)" }
          $cp = $jars -join ';'
          $sources = @(Get-ChildItem src/main/java/sodaviewer/*.java | ForEach-Object FullName)
          if ($sources.Count -lt 1) { throw 'No Java sources found' }
          Write-Host "javac $($sources.Count) sources, $($jars.Count) jars"
          & javac --release 17 -cp "$cp" -d target/classes @sources
          if ($LASTEXITCODE -ne 0) { throw "javac failed: $LASTEXITCODE" }
          if (-not (Test-Path 'target/classes/sodaviewer/SodaHomePanel.class')) {
            throw 'SodaHomePanel.class missing after javac'
          }

          if (Test-Path 'src/main/resources') {
            Copy-Item -Path 'src/main/resources/*' -Destination 'target/classes/' -Recurse -Force
          }

          Push-Location target/fat
          try {
            Get-ChildItem ../../lib/*.jar | ForEach-Object {
              & jar xf $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "jar xf failed: $($_.Name)" }
            }
            Remove-Item -ErrorAction SilentlyContinue META-INF/*.SF, META-INF/*.DSA, META-INF/*.RSA
            Copy-Item -Path ../classes/* -Destination . -Recurse -Force
            New-Item -ItemType Directory -Force -Path META-INF | Out-Null
            $manifest = @(
              'Manifest-Version: 1.0',
              'Main-Class: sodaviewer.Main',
              'Implementation-Title: SODAviewer',
              "Implementation-Version: $env:APP_VER",
              ''
            ) -join "`n"
            Set-Content -Path META-INF/MANIFEST.MF -Value $manifest -NoNewline -Encoding ascii
            & jar cfm ../SODAviewer.jar META-INF/MANIFEST.MF .
            if ($LASTEXITCODE -ne 0) { throw 'jar cfm failed' }
          }
          finally {
            Pop-Location
          }

          Get-Item target/SODAviewer.jar, lib/javafx/*.jar | Format-Table Name, Length

      - name: jpackage Windows app-image (SODAviewer.exe)
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MSYS_NO_PATHCONV: "1"
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          set -euo pipefail
          command -v jpackage
          command -v jlink
          bash package-app.sh
          # Flatten a copy of the launcher for a simple artifact name
          EXE="dist/SODAviewer/SODAviewer.exe"
          [[ -f "$EXE" ]] || { echo "Missing $EXE"; find dist -maxdepth 3 -type f | head -50; exit 1; }
          cp -f "$EXE" "dist/SODAviewer.exe"
          ls -lh dist/SODAviewer.exe dist/SODAviewer-*-windows-x64.zip

      - name: Upload SODAviewer.exe + zip
        uses: actions/upload-artifact@v4
        with:
          name: SODAviewer-windows-x64-${{ steps.ver.outputs.version }}
          path: |
            dist/SODAviewer.exe
            dist/SODAviewer-*-windows-x64.zip
            dist/SODAviewer-*.jar
          if-no-files-found: error

      - name: Publish Windows assets to GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: SODAviewer ${{ steps.ver.outputs.tag }}
          files: |
            dist/SODAviewer.exe
            dist/SODAviewer-*-windows-x64.zip
            dist/SODAviewer-*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
