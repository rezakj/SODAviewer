name: Windows dist (.exe)

# Native jpackage Windows app-image (SODAviewer.exe). Cannot be built on macOS.
#
# Trigger:
#   Actions → "Windows dist (.exe)" → Run workflow
#   Optional: check "Publish to GitHub Release" + tag (e.g. v0.2.4)
#   Or: push to main/master touching this workflow / packaging scripts
#
# Full multi-OS Release (including Windows): push a v* tag → "Release bundles"
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Upload Windows zip/exe to a GitHub Release"
        type: boolean
        default: false
      release_tag:
        description: "Release tag (e.g. v0.2.4). Empty = v$VERSION from VERSION file"
        type: string
        default: ""
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/windows-dist.yml"
      - "package-app.sh"
      - "build.sh"
      - "pom.xml"
      - "VERSION"
      - "src/**"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Read VERSION
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f VERSION ]]; then
            V="$(tr -d '[:space:]' < VERSION)"
          else
            V=0.2.0
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v${V}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "SODAviewer version=$V tag=$TAG"

      # Maven compiles + shades (avoids Windows Git Bash/pwsh javac classpath issues).
      # JavaFX win jars still land in lib/javafx for package-app.sh --module-path.
      - name: Maven package + Windows JavaFX for jpackage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lib/javafx
          BASE=https://repo.maven.apache.org/maven2
          JFX_VER=17.0.14
          for mod in base controls graphics swing web; do
            curl -fsSL -o "lib/javafx/javafx-${mod}-${JFX_VER}-win.jar" \
              "$BASE/org/openjfx/javafx-${mod}/${JFX_VER}/javafx-${mod}-${JFX_VER}-win.jar"
            test -s "lib/javafx/javafx-${mod}-${JFX_VER}-win.jar"
          done
          mvn -B -DskipTests package
          test -f target/SODAviewer.jar
          ls -lh target/SODAviewer.jar lib/javafx/

      - name: jpackage Windows app-image (SODAviewer.exe)
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Normalize JAVA_HOME for Git Bash before package-app.sh touches PATH.
          if command -v cygpath >/dev/null 2>&1 && [[ -n "${JAVA_HOME:-}" ]]; then
            export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          fi
          export PATH="${JAVA_HOME}/bin:${PATH}"
          echo "JAVA_HOME=$JAVA_HOME"
          ls -lh target/SODAviewer.jar lib/javafx/ | head -20
          command -v jpackage || ls -la "${JAVA_HOME}/bin"/jpackage*
          command -v jlink || ls -la "${JAVA_HOME}/bin"/jlink*
          bash package-app.sh
          # Flatten a copy of the launcher for a simple artifact name
          EXE="dist/SODAviewer/SODAviewer.exe"
          [[ -f "$EXE" ]] || { echo "Missing $EXE"; find dist -maxdepth 3 -type f | head -80; exit 1; }
          cp -f "$EXE" "dist/SODAviewer.exe"
          ls -lh dist/SODAviewer.exe dist/SODAviewer-*-windows-x64.zip

      - name: Upload SODAviewer.exe + zip
        uses: actions/upload-artifact@v4
        with:
          name: SODAviewer-windows-x64-${{ steps.ver.outputs.version }}
          path: |
            dist/SODAviewer.exe
            dist/SODAviewer-*-windows-x64.zip
            dist/SODAviewer-*.jar
          if-no-files-found: error

      - name: Publish Windows assets to GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: SODAviewer ${{ steps.ver.outputs.tag }}
          files: |
            dist/SODAviewer.exe
            dist/SODAviewer-*-windows-x64.zip
            dist/SODAviewer-*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
